# UDP port
acquisitionport 123

# Hardware timestamping (NIC-level TS eliminates host stack jitter)
# skipped if the NIC is unsupported.
hwtimestamp *

# Limit step corrections to 3 at startup; use slew afterwards to protect active OWAMP/TWAMP measurements
makestep 1 3

# Diagnostic logs for clock history tracking
log tracking measurements statistics

# Log time adjustments >= 1ms to syslog
logchange 0.001