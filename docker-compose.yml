services:
  testpoint:
    container_name: perfsonar-testpoint
    image: perfsonar/testpoint:systemd
    network_mode: host
    cgroup: host
    tty: true
    restart: unless-stopped
    cap_add:
      - NET_RAW
    environment:
      - TZ=UTC
      - container=docker
    tmpfs:
      - /run
      - /run/lock
      - /tmp
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - ./perfsonar/psconfig:/etc/perfsonar/psconfig:z
      - ./perfsonar/lsregistrationdaemon.conf:/etc/perfsonar/lsregistrationdaemon.conf:z
      - ./pscheduler/default-archives:/etc/pscheduler/default-archives:z
      - ./html/index.html:/var/www/html/index.html:z
      # Disable Lookup Service registration
      # - ./empty.service:/etc/systemd/system/multi-user.target.wants/perfsonar-lsregistrationdaemon.service
      # Apply custom test limits
      # - ./pscheduler/limits.conf:/etc/pscheduler/limits.conf:z
      - db:/var/lib/postgresql
      - log:/var/log
    healthcheck:
      test: ["CMD-SHELL", "curl -sfk https://localhost/pscheduler >/dev/null"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 180s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
volumes:
  db:
  log:
